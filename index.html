<style>
:root{color-scheme:light;--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--sub:#6c757d;--border:#e9ecef;--red:#e94560;--blue:#0984e3;--green:#00b894;--yellow:#fdcb6e;--orange:#e17055;--navy:#0f3460;--dark:#0f1923;--safe:linear-gradient(135deg,#00b894,#55efc4);--warn:linear-gradient(135deg,#fdcb6e,#f39c12);--danger:linear-gradient(135deg,#e94560,#d63031);--primary:linear-gradient(135deg,#0f3460,#0984e3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0);overflow-x:hidden}

/* PWA Install Banner */
.pwa-banner{display:none;position:fixed;bottom:70px;left:12px;right:12px;background:var(--dark);color:#fff;padding:14px 16px;border-radius:14px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,0.3);font-size:13px;align-items:center;gap:10px}
.pwa-banner.show{display:flex}
.pwa-banner .close-btn{margin-left:auto;background:none;border:none;color:#fff;font-size:18px;cursor:pointer}

/* Header */
.header{background:var(--dark);color:#fff;padding:max(env(safe-area-inset-top,12px),12px) 16px 10px;position:sticky;top:0;z-index:100}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:16px;font-weight:700}
.header-right{display:flex;align-items:center;gap:8px}
.badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700}
.badge-demo{background:var(--red)}
.badge-live{background:var(--green)}
.clock{font-size:10px;opacity:.7}

/* Risk Strip */
.risk-strip{padding:8px 16px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.risk-low{background:#d4edda;color:#155724}
.risk-med{background:#fff3cd;color:#856404}
.risk-high{background:#f8d7da;color:#721c24}
.risk-crit{background:#721c24;color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.8}}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;font-size:9px;color:var(--sub);cursor:pointer;transition:.2s;text-decoration:none}
.nav-item.active{color:var(--navy);font-weight:700}
.nav-item .icon{font-size:18px;margin-bottom:1px}

/* Page container */
.page{display:none;padding:12px 12px 72px;max-width:600px;margin:0 auto}
.page.active{display:block}
